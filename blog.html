<script>
const posts = [
  {
    tag: "Machine Learning",
    title: "What I Learned from StatQuest — ML Explained Simply",
    excerpt: "StatQuest is the best resource for understanding ML concepts visually. Here are my key takeaways from the first 10 lessons on machine learning fundamentals.",
    date: "September 2026",
    content: `
      <div class="modal-tag">Machine Learning</div>
      <div class="modal-title">What I Learned from StatQuest — ML Explained Simply</div>
      <div class="modal-date">September 2026 · 5 min read</div>
      <div class="modal-body">
        <p>When I started learning Machine Learning, the biggest challenge was not the concepts themselves — it was finding someone who could explain them without drowning me in mathematics. StatQuest by Josh Starmer changed everything.</p>
        <h3>Key Lesson 1: Machine Learning is Pattern Recognition</h3>
        <p>At its core, ML is about finding patterns in data that humans would take too long to find manually. A model does not "think" — it finds correlations and weights that minimize error on a given dataset.</p>
        <h3>Key Lesson 2: The Bias-Variance Tradeoff</h3>
        <p>This is the most important concept in ML that nobody explains properly. <strong>High bias</strong> means your model is too simple and misses patterns (underfitting). <strong>High variance</strong> means your model memorizes the training data and fails on new data (overfitting). The goal is always to find the sweet spot between the two.</p>
        <h3>Key Lesson 3: Always Evaluate on Unseen Data</h3>
        <p>A model that performs 99% on training data but 60% on test data is useless in the real world. Always split your data into training, validation, and test sets — and never touch your test set until the very end.</p>
        <h3>My Takeaway</h3>
        <p>The mathematics behind ML algorithms matters less than understanding what they do, when to use them, and how to evaluate them properly. Focus on intuition first, then dive into the math.</p>
      </div>`
  },
  {
    tag: "Deep Learning",
    title: "Andrej Karpathy's Zero to Hero — What You Must Know",
    excerpt: "Karpathy's neural network series is the most honest and deep dive into how LLMs actually work. Here are the concepts that changed how I think about AI.",
    date: "September 2026",
    content: `
      <div class="modal-tag">Deep Learning</div>
      <div class="modal-title">Andrej Karpathy's Zero to Hero — What You Must Know</div>
      <div class="modal-date">September 2026 · 6 min read</div>
      <div class="modal-body">
        <p>If you want to truly understand how neural networks and LLMs work from first principles, Andrej Karpathy's "Neural Networks: Zero to Hero" series is the only resource you need. Here is what I found most valuable.</p>
        <h3>Everything is Backpropagation</h3>
        <p>Every neural network — from a simple perceptron to GPT-4 — learns by computing gradients and adjusting weights. Karpathy's micrograd library shows this in just 100 lines of Python. Understanding this demystifies everything.</p>
        <h3>Language Models Predict the Next Token</h3>
        <p>GPT, LLaMA, Claude — they all do one thing: predict the next most likely token given what came before. That single objective, trained at massive scale on massive data, produces remarkably capable systems. It sounds simple because it is — the magic is in the scale.</p>
        <h3>Attention is the Key Innovation</h3>
        <p>The attention mechanism allows every token in a sequence to "look at" every other token and decide what is relevant. This is what allows transformers to handle long-range dependencies that RNNs struggled with.</p>
        <h3>My Recommendation</h3>
        <p>Watch the entire series with Google Colab open. Type out every line of code. Do not copy-paste. The muscle memory of building these things from scratch is irreplaceable.</p>
      </div>`
  },
  {
    tag: "NLP & LLMs",
    title: "How Large Language Models Actually Work — A Simple Explanation",
    excerpt: "LLMs are not magic. They are statistical models trained on text to predict the next token. Here is my simple breakdown of what's really happening under the hood.",
    date: "September 2026",
    content: `
      <div class="modal-tag">NLP & LLMs</div>
      <div class="modal-title">How Large Language Models Actually Work — A Simple Explanation</div>
      <div class="modal-date">September 2026 · 7 min read</div>
      <div class="modal-body">
        <p>Everyone is talking about LLMs but very few people understand what they actually are. Let me break it down as simply as possible.</p>
        <h3>Step 1: Tokenization</h3>
        <p>Text is broken into small pieces called tokens. The word "learning" might be one token, while "unbelievable" might be broken into "un", "believ", "able". The model never sees raw text — only numbers representing tokens.</p>
        <h3>Step 2: Embeddings</h3>
        <p>Each token is converted into a high-dimensional vector — a list of numbers that captures its meaning. Similar words end up with similar vectors. This is where semantic meaning lives in the model.</p>
        <h3>Step 3: Transformer Layers</h3>
        <p>The embeddings pass through many transformer layers. Each layer applies attention (which tokens should influence each other?) and feed-forward networks. After many layers, the model has a rich representation of the input.</p>
        <h3>Step 4: Next Token Prediction</h3>
        <p>The final layer produces a probability distribution over all possible next tokens. The model picks the most likely one (or samples from the distribution). This is repeated until the response is complete.</p>
        <h3>Why Are They So Capable?</h3>
        <p>Because they were trained on essentially all human-written text. The model has learned to compress and represent vast amounts of human knowledge into its billions of parameters.</p>
      </div>`
  },
  {
    tag: "Python",
    title: "Why Google Colab is the Best Tool for AI Learning",
    excerpt: "Forget Anaconda, PyCharm, and virtual environments. Google Colab gives you free GPU, all libraries pre-installed, and runs in your browser. Here is how to use it properly.",
    date: "September 2026",
    content: `
      <div class="modal-tag">Python</div>
      <div class="modal-title">Why Google Colab is the Best Tool for AI Learning</div>
      <div class="modal-date">September 2026 · 4 min read</div>
      <div class="modal-body">
        <p>One of the biggest barriers for beginners in AI is the setup. Installing Python, managing virtual environments, debugging CUDA — it is painful and discouraging. Google Colab removes all of that.</p>
        <h3>What is Google Colab?</h3>
        <p>Colab is a free, browser-based Jupyter notebook environment provided by Google. It comes with Python, NumPy, Pandas, TensorFlow, PyTorch and hundreds of other libraries pre-installed. You just open a browser and start coding.</p>
        <h3>Free GPU Access</h3>
        <p>Colab provides free access to GPU (and sometimes TPU) computing. Training neural networks that would take hours on a CPU can complete in minutes on Colab's free GPU.</p>
        <h3>How to Use It Effectively</h3>
        <ul>
          <li>Use <code>!pip install library_name</code> to install any extra library</li>
          <li>Mount Google Drive with <code>from google.colab import drive; drive.mount('/content/drive')</code></li>
          <li>Use <code>Runtime → Change runtime type → GPU</code> for deep learning</li>
          <li>Save your notebooks to Drive — they persist across sessions</li>
        </ul>
        <h3>One Tip</h3>
        <p>Colab sessions disconnect after 90 minutes of inactivity. For long training jobs, add a simple loop that runs periodically to keep the session alive, or upgrade to Colab Pro for longer sessions.</p>
      </div>`
  },
  {
    tag: "Research",
    title: "How to Read an AI Research Paper Without Getting Lost",
    excerpt: "Most AI papers are dense and intimidating. But there is a simple 3-pass method that makes any paper approachable. Here is how I read papers efficiently.",
    date: "September 2026",
    content: `
      <div class="modal-tag">Research</div>
      <div class="modal-title">How to Read an AI Research Paper Without Getting Lost</div>
      <div class="modal-date">September 2026 · 5 min read</div>
      <div class="modal-body">
        <p>Research papers look intimidating — dense equations, technical jargon, walls of text. But there is a structured way to read them that makes even complex papers approachable.</p>
        <h3>Pass 1: The 5-Minute Skim (Abstract + Figures)</h3>
        <p>Read only the abstract, introduction, conclusion, and look at all the figures. This gives you 80% of what the paper is about. Ask yourself: what problem does this solve? What is their main result? Is this relevant to what I am working on?</p>
        <h3>Pass 2: The Structure Read (30 minutes)</h3>
        <p>Now read the full paper but skip the math. Focus on the section headings, methodology description, and experiment design. You want to understand HOW they solved the problem, even if you do not understand every equation.</p>
        <h3>Pass 3: The Deep Dive (if needed)</h3>
        <p>Only do this for papers that are directly relevant to your research. Work through the mathematics, implement the key algorithm in code, and try to reproduce one of the main results.</p>
        <h3>My Personal Tip</h3>
        <p>After reading a paper, write a 3-sentence summary in your own words. If you cannot do this, you have not understood it yet. This forces active recall and reveals gaps in your understanding.</p>
      </div>`
  },
  {
    tag: "Machine Learning",
    title: "Supervised vs Unsupervised vs Reinforcement Learning — When to Use Which",
    excerpt: "The three paradigms of machine learning each solve different types of problems. Understanding when to use which one is the first skill every ML practitioner must develop.",
    date: "September 2026",
    content: `
      <div class="modal-tag">Machine Learning</div>
      <div class="modal-title">Supervised vs Unsupervised vs Reinforcement Learning — When to Use Which</div>
      <div class="modal-date">September 2026 · 5 min read</div>
      <div class="modal-body">
        <p>One of the most common questions from ML beginners is: which type of learning should I use for my problem? Here is a clear breakdown.</p>
        <h3>Supervised Learning — When you have labeled data</h3>
        <p>You have input data AND correct output labels. The model learns to map inputs to outputs. Use this for: spam detection (email → spam/not spam), image classification (image → cat/dog), house price prediction (features → price).</p>
        <h3>Unsupervised Learning — When you have unlabeled data</h3>
        <p>You only have input data with no labels. The model finds hidden structure on its own. Use this for: customer segmentation (group similar customers), anomaly detection (find unusual patterns), dimensionality reduction (compress data for visualization).</p>
        <h3>Reinforcement Learning — When you have an environment and reward</h3>
        <p>An agent learns by taking actions and receiving rewards or penalties. Use this for: game playing (chess, Go), robotics (walking, manipulation), recommendation systems (maximize user engagement).</p>
        <h3>Quick Decision Rule</h3>
        <p>Do you have labeled training data? → Supervised. No labels but want to find structure? → Unsupervised. Have an environment where you can take actions and get feedback? → Reinforcement Learning.</p>
      </div>`
  },
];

let activeFilter = 'all';

function renderPosts(filter) {
  const grid = document.getElementById('blogGrid');
  const filtered = filter === 'all' ? posts : posts.filter(p => p.tag === filter);
  grid.innerHTML = filtered.map((p, i) => `
    <div class="blog-card" onclick="openPost(${posts.indexOf(p)})">
      <span class="blog-tag">${p.tag}</span>
      <div class="blog-title">${p.title}</div>
      <div class="blog-excerpt">${p.excerpt}</div>
      <div class="blog-meta">
        <span class="blog-date">${p.date}</span>
        <span class="blog-read">Read more →</span>
      </div>
    </div>`).join('');
}

function filterPosts(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPosts(filter);
}

function openPost(index) {
  document.getElementById('modalBody').innerHTML = posts[index].content;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalBtn();
}

function closeModalBtn() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

renderPosts('all');
</script>
</body>
